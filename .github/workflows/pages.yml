name: Build firmware and deploy installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.2
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build ScopeBuddy
        run: /opt/esp/entrypoint.sh idf.py build

      - name: Create browser-installable firmware
        run: |
          mkdir -p docs/firmware
          /opt/esp/entrypoint.sh idf.py merge-bin -o "$GITHUB_WORKSPACE/docs/firmware/scopebuddy-v0.5.1.bin" -f raw
          sha256sum docs/firmware/scopebuddy-v0.5.1.bin > docs/firmware/scopebuddy-v0.5.1.bin.sha256

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
