name: Build firmware and deploy installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.2
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate published version
        shell: bash
        run: |
          VERSION="0.6.0"
          grep -Fq "set(PROJECT_VER \"$VERSION\")" CMakeLists.txt
          grep -Fq "#define AIUTO_VISTA_FIRMWARE_VERSION \"$VERSION\"" main/ui/ui_events.c
          grep -Fq "\"version\": \"$VERSION\"" docs/manifest.json
          grep -Fq "\"current\": \"$VERSION\"" docs/versions.json
          grep -Fq "\"firmware\": \"firmware/aiuto-vista-v$VERSION.bin\"" docs/versions.json

      - name: Build Aiuto-Vista
        run: /opt/esp/entrypoint.sh idf.py build

      - name: Create browser-installable firmware
        run: |
          mkdir -p docs/firmware
          /opt/esp/entrypoint.sh idf.py merge-bin -o "$GITHUB_WORKSPACE/docs/firmware/aiuto-vista-v0.6.0.bin" -f raw
          sha256sum docs/firmware/aiuto-vista-v0.6.0.bin > docs/firmware/aiuto-vista-v0.6.0.bin.sha256

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
